services:
  db:
    image: postgres:16-alpine
    container_name: portnet_db
    environment:
      POSTGRES_DB: portnet_souscription
      POSTGRES_USER: portnet
      POSTGRES_PASSWORD: portnet2026
      POSTGRES_HOST_AUTH_METHOD: "trust"
      POSTGRES_INITDB_ARGS: "--auth-host=trust --auth-local=trust"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
